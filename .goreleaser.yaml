# GoReleaser v2 —— devpilot-hook 的跨平台构建与分发。
#
# 发布前置条件：
#   1. DevPilot-APNS 已打 tag（pkg/wire 是本仓库的依赖）；
#   2. 仓库 Secrets 提供 HOMEBREW_TAP_TOKEN（推 twotwoba/homebrew-devpilot）；
#   3. tag 形如 v0.1.0。
version: 2

project_name: devpilot-hook

before:
  hooks:
    - go mod download

builds:
  - id: devpilot-hook
    main: ./cmd/devpilot-hook
    binary: devpilot-hook
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/twotwoba/DevPilot-Hook/internal/cli.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    files:
      - README.md

checksum:
  name_template: checksums.txt

# macOS：Cask 适合分发预编译 CLI。未签名版本需要去掉 quarantine 才能运行
# （Homebrew 下载解包时会主动打 quarantine 标记，不去掉 Gatekeeper 直接拦截执行）。
homebrew_casks:
  - name: devpilot-hook
    repository:
      owner: twotwoba
      name: homebrew-devpilot
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/twotwoba/DevPilot-Hook
    description: DevPilot hook daemon for Claude Code / Codex
    binaries:
      - devpilot-hook
    hooks:
      post:
        # install_steps（GoReleaser v2.19+ 新字段）生成 postflight_steps stanza；
        # 旧的 install 字段生成已弃用的 postflight，brew 每次都会刷警告。
        # StagedPath 模板变量会原样输出 Homebrew 的同名 token，由其执行期展开
        # 成实际 staging 路径（不能直接写花括号字面量，会被当成 Go 模板解析）。
        # 注意：新 DSL 是结构化步骤，#{staged_path} 这类 Ruby 插值不可用。
        install_steps: |
          # cask 也会在 Linux 的 Homebrew 上生成安装块，而 Linux 没有 xattr。
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/devpilot-hook"]
          end

# Linux：deb / rpm 便于服务器与桌面无人值守安装。
nfpms:
  - id: linux-packages
    package_name: devpilot-hook
    vendor: twotwoba
    homepage: https://github.com/twotwoba/DevPilot-Hook
    maintainer: twotwoba
    description: DevPilot hook daemon for Claude Code / Codex
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin

release:
  # 不能是 draft：cask 清单指向 release 资产，
  # 草案状态下外部下载会 404，用户装到一半失败。
  draft: false
  footer: |
    安装方式见 README（Homebrew Cask / install.sh / deb+rpm）。
